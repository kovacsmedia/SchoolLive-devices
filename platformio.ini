[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino, espidf

monitor_speed = 115200
upload_protocol = esptool

; --- ESP32-S3 N16R8: 16 MB Flash + 8 MB OPI PSRAM ---
; Csak N16R8 modulokat használunk éles eszközökön.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; --- EGYEDI PARTÍCIÓS TÁBLA (OTA marad) ---
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L

; --- MÉRET OPTIMALIZÁLÁS ---
build_type = release

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"S3.55\"
    -Wno-unused-variable

    ; ESP32-S3 USB CDC / Serial
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; PSRAM
    -DBOARD_HAS_PSRAM

    ; size optim — minden forrásra alkalmazható (C és C++)
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

    ; ESP32-audioI2S méretcsökkentés (csak define-ok, mindenhol OK)
    -DAUDIO_ENABLE_SD=0
    -DAUDIO_ENABLE_SDMMC=0
    -DAUDIO_ENABLE_SPIFFS=0
    -DAUDIO_ENABLE_FFAT=0
    -DAUDIO_GCC_OPTIMIZE=\"Os\"

    ; LittleFS: mixed Arduino+ESP-IDF módban az `esp_littlefs` az Arduino-ESP32
    ; csomag precompiled lib-je, nem automatikusan linkelődik. Kell:
    ; - CONFIG_LITTLEFS_PAGE_SIZE define, hogy a LittleFS.cpp implementációja
    ;   ne forduljon üresre (a teljes fájl egy #ifdef CONFIG_LITTLEFS_PAGE_SIZE
    ;   blokkba van zárva);
    ; - include path az esp_littlefs.h header-hez;
    ; - link path és -lesp_littlefs a precompiled libhez.
    -DCONFIG_LITTLEFS_PAGE_SIZE=256
    -I/Users/balazs/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp_littlefs/include
    -L/Users/balazs/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32s3/lib
    -lesp_littlefs

; A -fno-rtti és -fno-exceptions flageket szándékosan NEM állítjuk be:
; - build_flags-ben az ESP-IDF C-fájljaira is rákerülne és -Werror-ral hibázna;
; - build_src_flags-ben csak az src/-re vonatkozik, ami ABI mismatchet okoz az
;   Arduino lib-ekkel szemben (LittleFS::begin szignatúra eltér), és a linker
;   undefined reference-szel megáll.
; A binary így pár tíz KB-tal nagyobb, de cserébe konzisztens és linkelhető.

build_unflags =
    -O2

monitor_filters = esp32_exception_decoder

lib_deps =
    ;https://github.com/schreibfaul1/ESP32-audioI2S/archive/refs/tags/3.0.8.zip
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.0