[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_protocol = esptool

; --- ESP32-S3 N16R8: 16 MB Flash + 8 MB OPI PSRAM ---
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; --- EGYEDI PARTÍCIÓS TÁBLA (OTA marad) ---
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L

; --- MÉRET OPTIMALIZÁLÁS ---
build_type = release

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"S3.55\"
    -Wno-unused-variable

    ; ESP32-S3 USB CDC / Serial
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; PSRAM
    -DBOARD_HAS_PSRAM

    ; size optim
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

    ; C++ size shrink
    -fno-exceptions
    -fno-rtti

    ; ESP32-audioI2S méretcsökkentés
    -DAUDIO_ENABLE_SD=0
    -DAUDIO_ENABLE_SDMMC=0
    -DAUDIO_ENABLE_SPIFFS=0
    -DAUDIO_ENABLE_FFAT=0
    -DAUDIO_GCC_OPTIMIZE=\"Os\"

build_unflags =
    -O2

monitor_filters = esp32_exception_decoder

lib_deps =
    ;https://github.com/schreibfaul1/ESP32-audioI2S/archive/refs/tags/3.0.8.zip
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.0