[env:esp32dev]
; pioarduino: ESP-IDF v5.5.x + Arduino-ESP32 v3.3.x mixed mode.
; Az ESP-IDF v5.x-re vártunk át, mert a CarlosDerSeher snapclient natívan
; v5.x API-kat használ (driver/i2s_std.h, freertos/idf_additions.h, esp_mac.h).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf

monitor_speed = 115200
upload_protocol = esptool

; --- ESP32-S3 N16R8: 16 MB Flash + 8 MB OPI PSRAM ---
; Csak N16R8 modulokat használunk éles eszközökön.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; --- EGYEDI PARTÍCIÓS TÁBLA (4 MB app + 4 MB OTA + 8 MB littlefs) ---
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L

; --- MÉRET OPTIMALIZÁLÁS ---
build_type = release

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"S4.6\"
    -Wno-unused-variable

    ; ESP32-S3 USB CDC / Serial
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; PSRAM
    -DBOARD_HAS_PSRAM

    ; size optim — minden forrásra alkalmazható (C és C++)
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

    ; ESP32-audioI2S méretcsökkentés (csak define-ok, mindenhol OK)
    -DAUDIO_ENABLE_SD=0
    -DAUDIO_ENABLE_SDMMC=0
    -DAUDIO_ENABLE_SPIFFS=0
    -DAUDIO_ENABLE_FFAT=0
    -DAUDIO_GCC_OPTIMIZE=\"Os\"

; A -fno-rtti és -fno-exceptions flageket szándékosan NEM állítjuk be:
; - build_flags-ben az ESP-IDF C-fájljaira is rákerülne;
; - build_src_flags-ben csak az src/-re vonatkozik, ami ABI mismatchet okozhat az
;   Arduino lib-ekkel szemben.
; A binary így pár tíz KB-tal nagyobb, de cserébe konzisztens és linkelhető.

build_unflags =
    -O2

monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.0
    links2004/WebSockets @ ^2.4.1
